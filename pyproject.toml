[project]
name = "symetrix-prism"
version = "0.1.0"
description = "Home Assistant integration for Symetrix Composer DSPs"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["custom_components", "tools"]
explicit_package_bases = true
mypy_path = "."

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "PT"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components", "tools"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC109", "ASYNC110", "SLF001"]
